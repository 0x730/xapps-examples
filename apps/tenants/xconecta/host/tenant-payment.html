<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>xconecta Tenant Payment Checkout</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 700px;
        margin: 0 auto;
        border: 1px solid #e2e8f0;
        background: #fff;
        border-radius: 14px;
        padding: 18px;
        display: grid;
        gap: 10px;
      }
      .title {
        font-size: 20px;
        font-weight: 800;
      }
      .muted {
        color: #64748b;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #0f766e;
        background: #0f766e;
        color: #fff;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.ghost {
        background: #fff;
        color: #0f172a;
        border-color: #cbd5e1;
      }
      code {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <div class="card" aria-busy="true" id="card">
      <div class="title">xconecta Tenant Payment Checkout</div>
      <div class="muted">
        Tenant-owned payment page (reference implementation). On success, returns signed payment
        evidence to the caller widget URL.
      </div>
      <div><strong>xapp</strong>: <code id="xappId">unknown</code></div>
      <div><strong>tool</strong>: <code id="toolName">unknown</code></div>
      <div><strong>amount</strong>: <code id="amount">0</code> <code id="currency">USD</code></div>
      <div><strong>session</strong>: <code id="sessionId">-</code></div>
      <div><strong>return</strong>: <code id="returnUrl">-</code></div>
      <div class="row">
        <button id="payBtn" type="button" aria-label="Pay and return to application">
          Pay and Return
        </button>
        <button id="cancelBtn" type="button" class="ghost" aria-label="Cancel payment">
          Cancel
        </button>
      </div>
      <div id="msg" class="muted" aria-live="polite"></div>
    </div>
    <script type="module">
      import { createOwnerManagedPaymentPageController } from "/embed/sdk/xapps-embed-sdk.esm.js";

      (function () {
        const controller = createOwnerManagedPaymentPageController(window.location.href);
        const paymentSessionId = String(controller.paymentSessionId || "").trim();
        const queryReturnUrl = String(controller.queryReturnUrl || "").trim();
        const queryCancelUrl = String(controller.queryCancelUrl || "").trim();
        const queryResume = String(controller.resumeToken || "").trim();
        const msgEl = document.getElementById("msg");
        const payBtn = document.getElementById("payBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const cardEl = document.getElementById("card");
        let session = null;

        function formatCurrency(amount, currency) {
          const num = Number(amount);
          if (isNaN(num)) return amount + " " + currency;
          try {
            return new Intl.NumberFormat(undefined, {
              style: "currency",
              currency: currency || "USD",
            }).format(num);
          } catch (e) {
            return num.toFixed(2) + " " + currency;
          }
        }

        function setText(id, value) {
          document.getElementById(id).textContent = value;
        }

        function renderSession(s) {
          const effectiveReturnUrl = controller.resolveReturnUrl(s) || "";
          setText("xappId", s.xapp_id || "unknown");
          setText("toolName", s.tool_name || "unknown");
          setText("amount", formatCurrency(s.amount, (s.currency || "USD").toUpperCase()));
          setText("currency", "");
          setText("sessionId", s.payment_session_id || paymentSessionId || "-");
          setText("returnUrl", effectiveReturnUrl || "-");
        }

        function isSessionExpired(s) {
          if (!s || !s.expires_at) return false;
          return new Date(s.expires_at).getTime() <= Date.now();
        }

        async function loadSession() {
          if (!paymentSessionId) throw new Error("Missing payment_session_id");
          const qs = new URLSearchParams({ payment_session_id: paymentSessionId });
          if (queryReturnUrl) qs.set("return_url", queryReturnUrl);
          if (queryCancelUrl) qs.set("cancel_url", queryCancelUrl);
          if (queryResume) qs.set("xapps_resume", queryResume);
          const res = await fetch("/api/tenant-payment/session?" + qs.toString());
          const data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) throw new Error(data.message || "Failed to load payment session");
          return data && data.result ? data.result : null;
        }

        function isSafeRedirectUrl(url) {
          try {
            const parsed = new URL(String(url || "").trim(), window.location.href);
            return parsed.protocol === "http:" || parsed.protocol === "https:";
          } catch (e) {
            return false;
          }
        }

        function navigateSafely(url) {
          const redirectUrl = String(url || "").trim();
          if (!redirectUrl) return false;
          if (!isSafeRedirectUrl(redirectUrl)) {
            throw new Error("Unsafe redirect URL");
          }
          window.location.href = redirectUrl;
          return true;
        }

        function goBack() {
          const cancelUrl = controller.resolveCancelUrl({
            session,
            referrer: document.referrer,
          });
          if (!cancelUrl) {
            history.back();
            return;
          }
          try {
            if (!navigateSafely(cancelUrl)) history.back();
          } catch (e) {
            msgEl.textContent = e && e.message ? e.message : String(e);
            history.back();
          }
        }

        async function finalizeClientCollect(result) {
          const flow = String((result || {}).flow || "")
            .trim()
            .toLowerCase();
          const clientSettleUrl = String((result || {}).client_settle_url || "").trim();
          if (flow !== "client_collect" || !clientSettleUrl) {
            throw new Error("Invalid client_collect response");
          }
          const metadata = result && typeof result.metadata === "object" ? result.metadata : {};
          const clientToken = String(metadata.client_token || "").trim();
          const settleRes = await fetch("/api/tenant-payment/client-settle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              payment_session_id: session.payment_session_id,
              status: "paid",
              ...(clientToken ? { client_token: clientToken } : {}),
            }),
          });
          const settleData = await settleRes.json().catch(function () {
            return {};
          });
          if (!settleRes.ok) {
            throw new Error(settleData.message || "Failed to finalize client-settle");
          }
          const redirectUrl = String((settleData.result && settleData.result.redirect_url) || "");
          if (!redirectUrl) throw new Error("Missing redirect URL");
          navigateSafely(redirectUrl);
        }

        cancelBtn.addEventListener("click", goBack);
        payBtn.addEventListener("click", async function () {
          try {
            if (!session) throw new Error("Payment session not loaded");
            msgEl.textContent = "Finalizing payment...";
            payBtn.disabled = true;
            const res = await fetch("/api/tenant-payment/complete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                payment_session_id: session.payment_session_id,
                ...(queryResume ? { xapps_resume: queryResume } : {}),
                ...(queryReturnUrl ? { return_url: queryReturnUrl } : {}),
                ...(queryCancelUrl ? { cancel_url: queryCancelUrl } : {}),
              }),
            });
            const data = await res.json().catch(function () {
              return {};
            });
            if (!res.ok) throw new Error(data.message || "Failed to finalize payment");
            const result = data && data.result ? data.result : {};
            const flow = String(result.flow || "")
              .trim()
              .toLowerCase();
            if (flow === "client_collect") {
              msgEl.textContent = "Collecting payment with provider...";
              await finalizeClientCollect(result);
              return;
            }
            const redirectUrl = String(result.redirect_url || "");
            if (!redirectUrl) throw new Error("Missing redirect URL");
            navigateSafely(redirectUrl);
          } catch (e) {
            payBtn.disabled = false;
            msgEl.textContent = e && e.message ? e.message : String(e);
          }
        });

        (async function () {
          try {
            if (
              controller.hasReturnedPaymentEvidence &&
              controller.redirectReturnedPaymentToHost()
            ) {
              return;
            }
            payBtn.disabled = true;
            msgEl.textContent = "Loading payment session...";
            session = await loadSession();
            if (!session) throw new Error("Payment session unavailable");
            if (isSessionExpired(session)) {
              msgEl.textContent = "This payment session has expired. Please start a new payment.";
              cardEl.setAttribute("aria-busy", "false");
              return;
            }
            renderSession(session);
            msgEl.textContent = "";
            payBtn.disabled = false;
            cardEl.setAttribute("aria-busy", "false");
          } catch (e) {
            cardEl.setAttribute("aria-busy", "false");
            msgEl.textContent = e && e.message ? e.message : String(e);
          }
        })();
      })();
    </script>
  </body>
</html>
