<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Xconect Single Xapp Reference</title>
    <link rel="stylesheet" href="/host/xconect-host-base.css?v=20260320-host-proof-1" />
    <link rel="stylesheet" href="/host/xconect-host-marketplace.css?v=20260320-host-proof-1" />
  </head>
  <body data-mode="single-panel" data-reference-tenant="xconect">
    <script>
      (function () {
        const aliases = { slate: "harbor", graphite: "atlas" };
        try {
          const rawTheme = String(
            window.localStorage.getItem("xconect_reference_host_theme_v1") || "",
          ).trim();
          const theme = aliases[rawTheme] || rawTheme;
          if (["harbor", "atlas", "copper", "emerald", "iris"].includes(theme)) {
            document.body.dataset.theme = theme;
          }
        } catch {
          // ignore localStorage failures
        }
      })();
    </script>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-copy">
            <strong>Xconect Marketplace Workspace</strong>
            <span class="brand-subtitle">Tenant-side host shell for the xconect + xplace lane</span>
            <div class="brand-badges">
              <span id="host-reference-badge" class="brand-chip brand-chip--tenant">xconect</span>
              <span id="host-stack-badge" class="brand-chip brand-chip--stack">Node + Fastify</span>
            </div>
          </div>
        </div>
        <button id="host-header-toggle" class="topbar-toggle" type="button" aria-expanded="true">
          Hide header
        </button>
        <div class="topbar-actions">
          <div class="pill display-pill"><strong id="identity-name">-</strong></div>
          <div class="pill display-pill" id="identity-email">-</div>
          <div class="pill display-pill">subject <strong id="identity-subject">-</strong></div>
          <select
            id="host-theme-select"
            class="theme-select interactive-control"
            aria-label="Choose host theme"
          >
            <option value="harbor">Harbor</option>
            <option value="atlas">Atlas</option>
            <option value="copper">Copper</option>
            <option value="emerald">Emerald</option>
            <option value="iris">Iris</option>
          </select>
          <div class="mode-switch interactive-shell">
            <a class="mode-link" href="/marketplace.html?mode=single-panel">Single panel</a>
            <a class="mode-link" href="/marketplace.html?mode=split-panel">Split panel</a>
            <button class="mode-btn is-active" type="button">Single xapp</button>
          </div>
          <button id="host-proof-button" class="context-btn interactive-control" type="button">
            Info
          </button>
          <div class="direct-controls topbar-direct-controls interactive-shell">
            <label class="field">
              <span>Xapp id</span>
              <input
                id="xappId"
                type="text"
                value="01KKYA9CQKNTG3N9PWM0Z31Z09"
                spellcheck="false"
              />
            </label>
            <button id="loadXapp" type="button">Open xapp</button>
          </div>
          <a class="ghost-link interactive-control" href="/">Back to launcher</a>
        </div>
      </header>

      <section class="workspace">
        <div class="intro intro--compact">
          <h1>Single-xapp workspace</h1>
          <p>
            Open one deployed xapp directly while keeping the same tenant host/runtime contract.
          </p>
        </div>
        <div id="mode-shell" class="mode-shell"></div>
      </section>
      <aside id="host-proof-panel" class="proof-flyout" aria-live="polite" hidden></aside>

      <div id="host-modal" class="host-modal-backdrop" aria-hidden="true">
        <div
          class="host-modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="host-modal-title"
        >
          <h3 id="host-modal-title">Notice</h3>
          <div id="host-modal-message" class="host-modal-message"></div>
          <div class="host-modal-actions">
            <button id="host-modal-close" class="host-modal-btn" type="button">Close</button>
          </div>
        </div>
      </div>

      <div id="toast-root" class="toasts"></div>
      <script
        type="module"
        src="/host/xconect-single-xapp-host.js?v=20260320-host-proof-1"
      ></script>
    </div>
  </body>
</html>
